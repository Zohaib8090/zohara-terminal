[package]
name = "ut-tui"
description = "Interactive terminal-hosted multiplexer UI (Section 4/13): real split panes over ut-session, rendered with ratatui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ut_tui"
path = "src/lib.rs"

[[bin]]
name = "ut-tui"
path = "src/main.rs"

[dependencies]
ut-session = { path = "../../services/ut-session" }
ut-grid = { path = "../../core/ut-grid" }
ut-ui = { path = "../ut-ui" }
ut-input = { path = "../ut-input" }
ut-safety = { path = "../../core/ut-safety" }
ut-plugin-api = { path = "../../plugins/ut-plugin-api" }
ut-plugin-loader = { path = "../../plugins/ut-plugin-loader" }
ut-plugin-signing = { path = "../../plugins/ut-plugin-signing" }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
