[package]
name = "ut-plugin-signing"
description = "Signed plugin manifests (Section 19 'Signed plugins'): ed25519 signing, verification, and version pinning"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
